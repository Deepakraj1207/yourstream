# Builds the Android APK and publishes it on the Releases page, either when a version tag is
# pushed (git tag v0.2.0 && git push origin v0.2.0), or from Actions -> Release APK -> Run
# workflow with a version (the release and its tag are then created at that commit).
#
# The APK carries the app's Telegram API credentials from the repository secrets TELEGRAM_API_ID
# and TELEGRAM_API_HASH (required), so users only sign in with their phone number or a QR code.
# Like every Telegram client, anything in an APK can be extracted from it; the secrets keep the
# values out of git.
#
# Optional, so updates install over earlier releases: repository secrets RELEASE_KEYSTORE_BASE64,
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. Without them the APK is signed
# with a throwaway debug key (installing a newer release then needs uninstalling the old one).
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK (ANDROID_HOME); add what this project compiles against.
      - name: Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key (optional)
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key: signing with a throwaway debug key"
          fi

      - name: Version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Version must look like v0.2.0, got '$TAG'"; exit 1 ;; esac

      - name: Build APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # Optional: a free TMDB key (themoviedb.org -> Settings -> API) gives better title
          # matching and posters, especially for Indian titles. Without it Cinemeta is used.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          VERSION_NAME: ${{ env.TAG }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Set the repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH (my.telegram.org -> API development tools)"
            exit 1
          fi
          export VERSION_NAME="${VERSION_NAME#v}"
          # A release is built from scratch: no outputs reused from the shared build cache.
          # Hilt/KSP occasionally misses a module on a cold build; one full retry fixes it.
          export SPLIT_APKS=true
          ./gradlew --no-daemon --no-build-cache assembleRelease || ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleRelease
          # The universal APK (any device; what earlier versions' updater downloads) and one per
          # CPU type (what the in-app updater picks: a much smaller download).
          mkdir -p dist dist-abi
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/YourStream-${TAG}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist-abi/YourStream-${TAG}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk; cd ../dist-abi && sha256sum *.apk) > dist/SHA256SUMS.txt
          ls -la dist dist-abi

      - name: Check that the Telegram credentials are built in
        run: |
          CONFIG=app/build/generated/source/buildConfig/release/dev/yourstream/BuildConfig.java
          if grep -q 'TELEGRAM_API_ID = 0;' "$CONFIG" || grep -q 'TELEGRAM_API_HASH = "";' "$CONFIG"; then
            echo "::error::The APK has no Telegram API credentials"; exit 1
          fi
          echo "OK: Telegram API credentials built in"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The universal APK goes up first: updaters before 0.8 take the first .apk they see.
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "YourStream $TAG" \
            --notes-file .github/release-notes.md \
            --generate-notes
          gh release upload "$TAG" dist-abi/*
