# Builds the Android APK and publishes it on the Releases page, either when a version tag is
# pushed (git tag v0.2.0 && git push origin v0.2.0), or from Actions -> Release APK -> Run
# workflow with a version (the release and its tag are then created at that commit).
#
# The published APK has NO Telegram API credentials built in (this repository is public and an
# APK can be unpacked). Users enter their own API ID and hash once in Settings -> Telegram API.
# The repository's TELEGRAM_* secrets are deliberately not used here.
#
# Optional, so updates install over earlier releases: repository secrets RELEASE_KEYSTORE_BASE64,
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. Without them the APK is signed
# with a throwaway debug key (installing a newer release then needs uninstalling the old one).
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key (optional)
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key: signing with a throwaway debug key"
          fi

      - name: Version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Version must look like v0.2.0, got '$TAG'"; exit 1 ;; esac

      - name: Build APK (no built-in Telegram credentials)
        env:
          VERSION_NAME: ${{ env.TAG }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/YourStream-${TAG}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Check that no credentials are built in
        run: |
          CONFIG=app/build/generated/source/buildConfig/release/dev/yourstream/BuildConfig.java
          grep -q 'TELEGRAM_API_ID = 0;' "$CONFIG"
          grep -q 'TELEGRAM_API_HASH = "";' "$CONFIG"
          echo "OK: no Telegram API credentials in this APK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "YourStream $TAG" \
            --notes-file .github/release-notes.md \
            --generate-notes
