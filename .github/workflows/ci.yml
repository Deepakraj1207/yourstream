# Builds and tests every push and pull request: unit tests (JVM and Robolectric), Android lint
# and a debug APK. Releases (release.yml) run the same tests before publishing.
#
# No secrets are needed: the debug build works without the Telegram API credentials (sign-in
# then reports that the app is not configured), and tests use made-up values.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests of every module (Android modules have only the debug variant), lint, the APK.
      - name: Tests, lint, debug APK
        run: ./gradlew --continue test :app:lintDebug :app:assembleDebug

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.html
          retention-days: 14
