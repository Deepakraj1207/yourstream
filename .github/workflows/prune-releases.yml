# One-off maintenance: delete every release (and its tag) except the one named in `keep`.
# Run by hand from the Actions tab; it refuses to run if `keep` is not an existing release.
name: Prune old releases

on:
  workflow_dispatch:
    inputs:
      keep:
        description: Release tag to keep (all others are deleted, with their tags)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: ${{ inputs.keep }}
    steps:
      - name: Check the release to keep exists
        run: gh release view "$KEEP" --json tagName --jq .tagName
      - name: Delete every other release and its tag
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "$KEEP" ]; then
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
      - name: Remaining releases
        run: gh release list --limit 200
