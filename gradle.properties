org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Build cache off: builds that reused cached task outputs intermittently produced an app whose
# Hilt graph missed whole library modules (a different module each time; docs/IMPLEMENTATION_PROGRESS.md,
# Phase 1). Every build without the cache passed. Incremental builds are unaffected.
org.gradle.caching=false
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
